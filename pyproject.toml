[project]
name = "wkafka-mcp"
version = "0.3.0"
description = "MCP Server for WKafka Architecting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "William Rodriguez (wisrovi)", email = "wisrovi.rodriguez@gmail.com"}
]
keywords = ["mcp", "wkafka", "kafka", "streaming", "ai", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "fastmcp>=0.1.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/wisrovi/wkafka_mcp"
Repository = "https://github.com/wisrovi/wkafka_mcp.git"
Issues = "https://github.com/wisrovi/wkafka_mcp/issues"

[project.scripts]
wkafka-mcp = "wkafka_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.0",
    "pylint>=3.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
